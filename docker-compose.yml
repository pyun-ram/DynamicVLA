# Single image with both conda envs: isaaclab + dynamicvla-train
#
# Build:
#   docker compose build
# Run:
#   docker compose run --rm dynamicvla bash

services:
  dynamicvla:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: dynamicvla:latest
    environment:
      OMNI_KIT_ACCEPT_EULA: "YES"
      ACCEPT_EULA: "Y"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/workspace/DynamicVLA
    working_dir: /workspace/DynamicVLA
    stdin_open: true
    tty: true
    shm_size: "16gb"
    command: bash
